# Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hire-ai-resume-jd
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install uv &&
      uv sync --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/
    envVars:
      - key: MODEL_NAME
        value: BAAI/bge-small-en-v1.5
      - key: APP_VERSION
        value: 1.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: SKILL_WEIGHT
        value: 0.40
      - key: EXPERIENCE_WEIGHT
        value: 0.30
      - key: SEMANTIC_WEIGHT
        value: 0.20
      - key: EDUCATION_WEIGHT
        value: 0.10
      - key: PYTHON_VERSION
        value: 3.12.0
